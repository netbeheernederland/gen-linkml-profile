version = "0.40.0"
description = ""
authors = [
    { name = "Ritger Teunissen", email = "ritger.teunissen@alliander.com" }
]
readme = "README.md"
license = "Apache-2.0"
requires-python = "~=3.10"
dependencies = [
    "linkml~=1.7",
    "click~=8.1",
    "treelib~=1.7",
    "jinja2~=3.1",
    "rdflib (>=7.6.0,<8.0.0)",
